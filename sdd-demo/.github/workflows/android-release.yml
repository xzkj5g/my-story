name: Android Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Unique release date in YYYY.MM.DD format'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Validate, sign, and publish release APK
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Check release branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "Releases are allowed only from main (received $RELEASE_REF)." >&2
            exit 1
          fi

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "Release tag must match YYYY.MM.DD." >&2
            exit 1
          fi
          normalized_tag="$(date -u -d "${RELEASE_TAG//./-}" '+%Y.%m.%d' 2>/dev/null || true)"
          if [ "$normalized_tag" != "$RELEASE_TAG" ]; then
            echo "Release tag is not a valid calendar date." >&2
            exit 1
          fi

      - name: Check for duplicate release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh api --silent "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A Git tag named $RELEASE_TAG already exists." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A GitHub Release named $RELEASE_TAG already exists." >&2
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK API 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Run detekt
        run: ./gradlew --no-daemon detekt

      - name: Run debug unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Sign and verify release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p release-metadata
          keystore="$RUNNER_TEMP/android-release.keystore"
          unsigned_apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$unsigned_apk" ]; then
            echo "No release APK was produced." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          build_tools="${ANDROID_HOME}/build-tools/36.0.0"
          "$build_tools/zipalign" -f 4 "$unsigned_apk" "$RUNNER_TEMP/aligned-release.apk"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out release-metadata/app-release.apk \
            "$RUNNER_TEMP/aligned-release.apk"
          "$build_tools/apksigner" verify --verbose --print-certs release-metadata/app-release.apk \
            > release-metadata/certificate.txt
          sha256sum release-metadata/app-release.apk > release-metadata/app-release.apk.sha256
          printf 'source_revision=%s\nrelease_tag=%s\n' "$GITHUB_SHA" "$RELEASE_TAG" \
            > release-metadata/release.txt
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          generate_release_notes: true
          body_path: release-metadata/release.txt
          files: |
            release-metadata/app-release.apk
            release-metadata/app-release.apk.sha256
            release-metadata/certificate.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Remove temporary signing material
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/android-release.keystore"
          rm -f "$RUNNER_TEMP/aligned-release.apk"

      - name: Write release workflow summary
        if: ${{ always() }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          {
            echo "## Android release"
            echo
            echo "- Source branch: \`main\`"
            echo "- Release tag: \`$RELEASE_TAG\`"
            echo "- Source revision: \`$GITHUB_SHA\`"
            echo "- Stages: setup, validation, release build, signing, verification, and publication."
            echo "- Signed APK, certificate fingerprint, and SHA-256 checksum are attached when publication succeeds."
          } >> "$GITHUB_STEP_SUMMARY"
